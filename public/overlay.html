<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Kabaddi Overlay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;height:100vh}
.hidden{display:none!important}

/* SCOREBOARD */
.scoreboard{position:fixed;top:20px;right:20px;background:linear-gradient(135deg,rgba(10,10,30,.95),rgba(30,10,40,.95));border:3px solid #ffd700;border-radius:16px;padding:12px 18px;display:flex;align-items:center;gap:14px;min-width:500px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.team{display:flex;align-items:center;gap:10px}
.logo{width:55px;height:55px;border-radius:50%;object-fit:cover;border:3px solid #ffd700;background:#222}
.logo-ph{width:55px;height:55px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-weight:bold;border:3px solid #ffd700;color:#ffd700}
.name-scroll{white-space:nowrap;animation:scroll 8s linear infinite;font-weight:800;font-size:15px;text-transform:uppercase}
.punjabi{font-size:12px;color:#ffd700}
@keyframes scroll{0%,20%{transform:translateX(0)}80%,100%{transform:translateX(-40%)}}
.score{font-size:48px;font-weight:900;color:#ffd700;text-shadow:2px 2px 6px #000;min-width:55px;text-align:center}
.vs{color:#aaa;font-weight:bold;margin:0 6px}
.timer-box{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:3px 12px;border-radius:10px;font-size:13px;border:2px solid #ffd700}

/* TICKER */
.ticker{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,#1a1a2e,#16213e);color:#fff;padding:8px 0;font-size:16px;font-weight:bold;white-space:nowrap;overflow:hidden;border-top:3px solid #ffd700}
.ticker-text{display:inline-block;animation:ticker 20s linear infinite}
@keyframes ticker{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

/* PLAYER CARD */
.player-card{position:fixed;bottom:80px;left:40px;background:linear-gradient(135deg,#1a1a2e,#0f3460);border:3px solid #ffd700;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;color:#fff;min-width:280px}
.player-card img{width:60px;height:60px;border-radius:8px;object-fit:cover;border:2px solid #ffd700}
.player-info h3{margin:0;font-size:18px}
.player-info p{margin:2px 0;font-size:13px;color:#ffd700}
</style>
</head>
<body>
<div id="scoreboard" class="scoreboard">
  <div class="team">
    <div id="logoA" class="logo-ph">A</div>
    <div><div class="name-scroll" id="nameA">TEAM A</div><div class="punjabi" id="nameA_pun">ਟੀਮ ਏ</div></div>
  </div>
  <div style="display:flex;align-items:center">
    <div class="score" id="scoreA">0</div><div class="vs">-</div><div class="score" id="scoreB">0</div>
  </div>
  <div class="team">
    <div style="text-align:right"><div class="name-scroll" id="nameB">TEAM B</div><div class="punjabi" id="nameB_pun">ਟੀਮ ਬੀ</div></div>
    <div id="logoB" class="logo-ph">B</div>
  </div>
  <div class="timer-box" id="timer">20:00</div>
</div>

<div id="ticker" class="ticker hidden"><div class="ticker-text" id="tickerText">Welcome to Circle Kabaddi Live</div></div>

<div id="playerCard" class="player-card hidden">
  <img id="playerImg" src="" alt="">
  <div class="player-info"><h3 id="playerName">Player</h3><p id="playerInfo">Info</p></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
function setLogo(id,url,fb){
  const el=document.getElementById(id);
  if(!el)return;
  if(url){ if(el.tagName!=='IMG') el.outerHTML=`<img id="${id}" src="${url}" class="logo">`; else el.src=url; }
  else if(el.tagName==='IMG') el.outerHTML=`<div id="${id}" class="logo-ph">${fb}</div>`;
}
socket.on('state', s=>{
  document.getElementById('scoreA').textContent=s.teamA.score;
  document.getElementById('scoreB').textContent=s.teamB.score;
  document.getElementById('nameA').textContent=s.teamA.name||'TEAM A';
  document.getElementById('nameB').textContent=s.teamB.name||'TEAM B';
  document.getElementById('nameA_pun').textContent=s.teamA.namePunjabi||'ਟੀਮ ਏ';
  document.getElementById('nameB_pun').textContent=s.teamB.namePunjabi||'ਟੀਮ ਬੀ';
  document.getElementById('timer').textContent=s.timer||'20:00';
  setLogo('logoA',s.teamA.logo,'A');
  setLogo('logoB',s.teamB.logo,'B');
  document.getElementById('tickerText').textContent=s.ticker||'Circle Kabaddi Live';
  document.getElementById('ticker').classList.toggle('hidden', !s.showTicker);
  if(s.player){
    document.getElementById('playerName').textContent=s.player.name||'';
    document.getElementById('playerInfo').textContent=s.player.info||'';
    document.getElementById('playerImg').src=s.player.img||'';
    document.getElementById('playerCard').classList.toggle('hidden', !s.showPlayer);
  }
});
</script>
</body>
</html>
