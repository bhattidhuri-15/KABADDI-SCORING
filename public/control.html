<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabaddi Scoring Control</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f1a;
      color: #eee;
      margin: 0;
      padding: 15px;
      max-width: 620px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 15px;
      font-size: 26px;
    }
    .current-scores {
      display: flex;
      justify-content: space-around;
      background: #1a1a2e;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 22px;
      font-weight: bold;
      border: 2px solid #ffd700;
    }
    .team-section {
      background: #16213e;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #333;
    }
    .team-section h2 {
      margin-top: 0;
      color: #ffd700;
      text-align: center;
      font-size: 20px;
    }
    .score-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    button {
      padding: 14px 5px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #e94560;
      color: white;
    }
    button.plus { background: #00b894; }
    button.minus { background: #d63031; }
    button.small { font-size: 13px; padding: 8px; background: #0984e3; }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 6px;
      border: none;
      font-size: 15px;
      background: #222;
      color: white;
    }
    .logo-input { margin: 8px 0; }
    .logo-input label { display: block; margin-bottom: 4px; font-size: 13px; color: #aaa; }
    .update-btn, .reset-btn {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 17px;
      background: #0984e3;
    }
    .reset-btn { background: #d63031; }
    .status {
      text-align: center;
      margin: 10px 0;
      color: #00b894;
      font-weight: bold;
    }
    .overlay-link {
      text-align: center;
      margin-top: 16px;
      padding: 12px;
      background: #1a1a2e;
      border-radius: 10px;
      font-size: 14px;
    }
    .overlay-link a { color: #ffd700; word-break: break-all; }
    .preview-logo {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-top: 5px; border: 2px solid #ffd700;
    }
  </style>
</head>
<body>
  <h1>Kabaddi Live Control</h1>
  
  <div class="current-scores">
    <div><span id="dispA">Team A</span>: <span id="dispScoreA">0</span></div>
    <div><span id="dispB">Team B</span>: <span id="dispScoreB">0</span></div>
  </div>

  <div class="team-section">
    <h2>Team A</h2>
    <input type="text" id="nameA" placeholder="English Name (Team A)">
    <input type="text" id="nameA_pun" placeholder="Punjabi Name (ਟੀਮ ਏ)">
    <div class="logo-input">
      <label>Logo URL (recommended) or Upload:</label>
      <input type="text" id="logoUrlA" placeholder="https://example.com/logo.png">
      <input type="file" id="logoFileA" accept="image/*">
      <button class="small" onclick="uploadLogo('A')">Upload Logo A</button>
      <img id="previewA" class="preview-logo" style="display:none;">
    </div>
    <div class="score-buttons">
      <button class="plus" onclick="changeScore('A', 1)">+1</button>
      <button class="plus" onclick="changeScore('A', 2)">+2</button>
      <button class="plus" onclick="changeScore('A', 3)">+3</button>
      <button class="minus" onclick="changeScore('A', -1)">-1</button>
    </div>
  </div>

  <div class="team-section">
    <h2>Team B</h2>
    <input type="text" id="nameB" placeholder="English Name (Team B)">
    <input type="text" id="nameB_pun" placeholder="Punjabi Name (ਟੀਮ ਬੀ)">
    <div class="logo-input">
      <label>Logo URL (recommended) or Upload:</label>
      <input type="text" id="logoUrlB" placeholder="https://example.com/logo.png">
      <input type="file" id="logoFileB" accept="image/*">
      <button class="small" onclick="uploadLogo('B')">Upload Logo B</button>
      <img id="previewB" class="preview-logo" style="display:none;">
    </div>
    <div class="score-buttons">
      <button class="plus" onclick="changeScore('B', 1)">+1</button>
      <button class="plus" onclick="changeScore('B', 2)">+2</button>
      <button class="plus" onclick="changeScore('B', 3)">+3</button>
      <button class="minus" onclick="changeScore('B', -1)">-1</button>
    </div>
  </div>

  <button class="update-btn" onclick="updateTeams()">Update Teams, Names & Logos</button>
  <button class="reset-btn" onclick="resetScores()">Reset Scores to 0</button>

  <div class="status" id="status">Connected</div>

  <div class="overlay-link">
    <strong>OBS Overlay Link:</strong><br>
    <a id="overlayLink" href="/overlay" target="_blank">/overlay</a>
    <p style="margin-top:8px; font-size:13px;">Transparent background ke saath OBS mein use karo.</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusEl = document.getElementById('status');

    socket.on('connect', () => statusEl.textContent = 'Connected ✓');
    socket.on('disconnect', () => statusEl.textContent = 'Disconnected');

    socket.on('state', (state) => {
      document.getElementById('dispScoreA').textContent = state.teamA.score;
      document.getElementById('dispScoreB').textContent = state.teamB.score;
      document.getElementById('dispA').textContent = state.teamA.name || 'Team A';
      document.getElementById('dispB').textContent = state.teamB.name || 'Team B';
      
      document.getElementById('nameA').value = state.teamA.name || '';
      document.getElementById('nameB').value = state.teamB.name || '';
      document.getElementById('nameA_pun').value = state.teamA.namePunjabi || '';
      document.getElementById('nameB_pun').value = state.teamB.namePunjabi || '';
      
      if (state.teamA.logo) {
        document.getElementById('logoUrlA').value = state.teamA.logo;
        const p = document.getElementById('previewA');
        p.src = state.teamA.logo;
        p.style.display = 'block';
      }
      if (state.teamB.logo) {
        document.getElementById('logoUrlB').value = state.teamB.logo;
        const p = document.getElementById('previewB');
        p.src = state.teamB.logo;
        p.style.display = 'block';
      }
    });

    function changeScore(team, delta) {
      socket.emit('updateScore', { team, delta });
    }

    function updateTeams() {
      const data = {
        teamAName: document.getElementById('nameA').value || 'Team A',
        teamBName: document.getElementById('nameB').value || 'Team B',
        teamANamePunjabi: document.getElementById('nameA_pun').value || '',
        teamBNamePunjabi: document.getElementById('nameB_pun').value || '',
        teamALogo: document.getElementById('logoUrlA').value || '',
        teamBLogo: document.getElementById('logoUrlB').value || ''
      };
      socket.emit('updateTeams', data);
      statusEl.textContent = 'Updated successfully!';
      setTimeout(() => statusEl.textContent = 'Connected ✓', 2000);
    }

    function resetScores() {
      if (confirm('Scores 0 karne hain?')) {
        socket.emit('resetScores');
      }
    }

    async function uploadLogo(team) {
      const fileInput = document.getElementById(`logoFile${team}`);
      const file = fileInput.files[0];
      if (!file) { alert('Pehle image select karo'); return; }
      const formData = new FormData();
      formData.append('logo', file);
      try {
        const res = await fetch('/upload-logo', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.logoUrl) {
          document.getElementById(`logoUrl${team}`).value = data.logoUrl;
          const p = document.getElementById(`preview${team}`);
          p.src = data.logoUrl;
          p.style.display = 'block';
          statusEl.textContent = `Logo ${team} uploaded! Ab Update dabao.`;
        }
      } catch (e) {
        alert('Upload failed');
      }
    }

    document.getElementById('overlayLink').href = window.location.origin + '/overlay';
    document.getElementById('overlayLink').textContent = window.location.origin + '/overlay';
  </script>
</body>
</html>
